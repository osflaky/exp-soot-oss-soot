# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Soot CI
on:
  workflow_dispatch:

jobs:
  BuildAndTest:
    name: Build and Test with java ${{ matrix.java_version }} on ${{ matrix.os 
      }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        java_version: ['11', '17', '21']
        os: ['ubuntu-latest', 'windows-latest', 'windows-11-arm']
      fail-fast: false
      max-parallel: 6

    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Use Java ${{ matrix.java_version }}
      uses: actions/setup-java@v1
      with:
        java-version: ${{ matrix.java_version }}
    - name: Build and test Java ${{ matrix.java_version }}
      run: |
        mvn -B --no-transfer-progress clean test -PJava${{ matrix.java_version }} -DdisableXmlReport=true


    timeout-minutes: 150
